# Modular Storage System Configuration
# Created by Hazmad_

# Per-network limits
network:
  # Maximum number of blocks allowed in a single network
  max_blocks: 128

  # Maximum number of network cables allowed in a single network
  max_cables: 800

  # Maximum number of exporters allowed in a single network (bus limit)
  max_exporters: 200

  # Maximum number of importers allowed in a single network (bus limit)
  max_importers: 200

  # Tick interval for importer/exporter operations (20 ticks = 1 second)
  # Highly recommend you don't adjust this lower than 20
  import_export_tick_interval: 20


# Network Item Blacklist - Items that cannot be stored in networks or added to importer/exporter filters
# Add any items you want to prevent from being stored or filtered
# Use their exact Material names from: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html

blacklisted_items:
# Example: Uncomment the lines below to block these items
# - "CHEST"
# - "TRAPPED_CHEST"
# - "BARREL"
# - "HOPPER"
# - "DISPENSER"
# - "DROPPER"
# - "ENDER_CHEST"
# - "DIAMOND_SWORD"

# Skull Textures - Custom player head textures for importers and exporters
# These are base64-encoded texture values from https://minecraft-heads.com
skull_textures:
  exporter: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZDdlYjczN2U1YmU3MTIzYzUyOTNhOTI2MDVmOTIyZmZkMDExNzY5NmVjMjM4NWFkZTBmYWU3OTBkYTFkZTFkOSJ9fX0="
  importer: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNGFmMjY0MDAxMDhiNmZmYTc0ZjhiN2I4YWFjZTY4ODRkZTVkOGJmMThjZDQ2MGJkZDc1Y2RjYTExNWNiMDY4YyJ9fX0="

# Permission settings
permissions:
  require_use_permission: false
  require_craft_permission: false
  require_admin_permission: true

# Command cooldowns (in seconds) - Set to 0 to disable
# Prevents players from spamming commands and causing server lag
cooldowns:
  commands:
    info: 5        # /mss info - Display system statistics
    cleanup: 10    # /mss cleanup - Clean up orphaned data (admin only)
    recovery: 10   # /mss recovery - Recover lost storage disk
  gui:
    # Cache duration for terminal GUI item lists (in milliseconds)
    # Reduces database load when multiple players access the same terminal
    terminal_cache: 500

    # Cooldown before a player can re-open any GUI (in milliseconds)
    # Only applies if player closes and reopens rapidly (spam protection)
    open_cooldown: 1000

# Performance settings
performance:
  # Importer/Exporter processing limits
  # Adjust these if you have many importers/exporters and experience lag
  importer_exporter:
    # Maximum number of importers to process per tick cycle
    # Lower = less lag, but slower processing with many importers
    max_importers_per_tick: 1000

    # Maximum number of exporters to process per tick cycle
    # Lower = less lag, but slower processing with many exporters
    max_exporters_per_tick: 1000

    # Batch database operations for importers/exporters (recommended: true)
    # Groups multiple database writes together for better performance
    batch_operations: true

# Database settings
database:
  # Database type: "sqlite" or "mysql"
  type: "sqlite"

  # SQLite settings (used when type is "sqlite")
  sqlite:
    # File path for SQLite database (relative to plugin folder)
    file: "storage.db"
    journal_mode: "WAL"
    synchronous: "NORMAL"
    busy_timeout: 30000
    cache_size: 10000

  # MySQL/MariaDB settings (used when type is "mysql")
  # Allows external database connections
  mysql:
    host: "localhost"
    port: 3306
    database: "modular_storage"
    username: "minecraft"
    password: "changeme"
    # Use SSL for connection (recommended for remote databases)
    use_ssl: false
    # Additional connection properties (advanced)
    properties:
      useUnicode: "true"
      characterEncoding: "utf8"

  # Connection pool settings (applies to both SQLite and MySQL)
  # Don't change these unless you know what you are doing.
  connection_pool:
    maximum_pool_size: 10
    minimum_idle: 2
    connection_timeout: 30000
    idle_timeout: 600000
    max_lifetime: 1800000

# Debug settings
debug:
  enabled: false

# ============================================================
# Resource pack - gives MSS items distinct custom models so they're told apart
# from the vanilla blocks/items they're built on. Items always work and are
# named/described without a pack; this only changes how they LOOK in the
# inventory/hand. (A pack cannot reskin a block once it is PLACED in the world -
# placed MSS blocks always look like their vanilla block.)
# ============================================================
resource-pack:
  # Master switch. false = MSS tags nothing and items render as their plain
  # vanilla material. true = MSS stamps items so a pack can reskin them.
  enabled: false

  # PROTOTYPE: render placed network cables as connection-aware PIPES that visually join to neighbours,
  # using one item_display entity per cable (needs enabled: true + the pack). One entity per cable, so it
  # adds entity load on big networks — opt-in. false = cables keep their plain placed look.
  cable-pipes: false

  # Who delivers the pack to clients?
  #   false = you handle it (server.properties 'resource-pack', or another
  #           resource-pack plugin). MSS only tags the items.
  #   true  = MSS pushes the pack to players on join, using the settings below.
  handled-by-mss: false

  # How MSS makes the pack available (only used when handled-by-mss: true).
  self-host:
    # true  = MSS runs a tiny built-in HTTP server and serves the pack itself
    #         (no external host needed). false = MSS points clients at 'url' below.
    enabled: true
    # Port the built-in server binds. Must be reachable by clients (open/forward it).
    port: 25566
    # Host/IP clients use to reach the built-in server - your server's PUBLIC ip or
    # domain. Leave blank to use the server's configured IP; set it if players can't
    # download the pack.
    public-address: ""
    # The pack .zip in the plugin folder that MSS serves (place your built pack here).
    file: "resourcepack.zip"

  # External direct https link to the pack .zip (only used when self-host.enabled: false).
  url: ""

  # SHA-1 of the pack. Leave blank to auto-compute (from the local zip when self-hosting,
  # or by fetching the url). A correct hash lets clients cache the pack between joins.
  sha1: ""

  # If a player declines or fails to load the pack:
  #   false = let them keep playing (items just look vanilla)
  #   true  = treat the pack as required (client re-prompts / refuses to connect)
  required: false

  # Prompt shown to players when the pack is offered (MiniMessage).
  prompt: "<yellow>Install the Modular Storage System pack to see custom item textures.</yellow>"

# MSS Terminal / Security Terminal screen glow. When enabled, the air block directly in front of a terminal's
# screen emits a bright light (level 14, near torch-max). It follows the block on wrench-rotate and clears on
# break. Only lights an AIR block (a terminal flush against a wall won't glow).
terminal-light:
  enabled: true