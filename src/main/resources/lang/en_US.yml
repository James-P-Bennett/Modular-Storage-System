    recipe-not-found: "{mss-prefix}<red>Recipe '{recipe}' not found!</red>"
    recipes-empty-line: "{mss-prefix}"
    recipes-help: "{mss-prefix}<yellow>Use '/mss recipe <name>' for detailed recipe information</yellow>"
    recipes-registered-count: "{mss-prefix}<white>Registered: {registered}/{total} ({enabled} enabled)</white>"

  recovery:
    disk-removed-from-bay: "{mss-prefix}<yellow>Uninstalled disk from active drive bay slot. Retained items are no longer spooled on that network.</yellow>"

  removal:
