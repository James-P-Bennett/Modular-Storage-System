# Modular Storage System — language file (en_US)
# Auto-organized: dead/duplicate keys removed; only keys referenced by the plugin remain.
# Placeholders use {name}; {mss-prefix} expands to the prefix below. Formatting is MiniMessage.

prefix: "<gradient:#00D4FF:#0099CC><bold>[MSS]</bold></gradient>  "

commands:

  help:
    header: "{mss-prefix}<gold>=== Modular Storage System Commands ===</gold>"
    main-help: "{mss-prefix}<yellow>/mss help - Show this help message</yellow>"
    recovery: "{mss-prefix}<yellow>/mss recovery <disk_id> - Recover a storage disk by ID</yellow>"
    give: "{mss-prefix}<yellow>/mss give <item> [player] - Give MSS items</yellow>"
    info: "{mss-prefix}<yellow>/mss info - Show plugin information</yellow>"
    cleanup: "{mss-prefix}<yellow>/mss cleanup - Clean up expired data</yellow>"
    recipes: "{mss-prefix}<yellow>/mss recipes - List all recipes</yellow>"
    recipe: "{mss-prefix}<yellow>/mss recipe <name> - Show detailed recipe info</yellow>"
    reload: "{mss-prefix}<yellow>/mss reload [config|recipes|lang|all] - Reload configurations</yellow>"
  cooldown: "{mss-prefix}<red>Please wait {seconds} seconds before using this command again.</red>"
  gui-cooldown: "{mss-prefix}<red>Please wait before opening this GUI again.</red>"

  recovery:
    not-found: "{mss-prefix}<red>Storage disk with ID '{disk_id}' not found.</red>"
    success-dropped: "{mss-prefix}<green>Recovery successful! Disk dropped at your location (inventory full).</green>"
    success-inventory: "{mss-prefix}<green>Recovery successful! Disk added to your inventory.</green>"
    disk-info: "<gray>Disk ID: {disk_id}</gray>"
    crafter-info: "<gray>Original Crafter: {crafter}</gray>"
    cells-info: "<gray>Cells Used: {used}/{max}</gray>"
    error: "{mss-prefix}<red>Error during recovery: {error}</red>"
    active-disk-warning: "{mss-prefix}<red>WARNING:</red> <yellow>This disk is currently active in a drive bay!</yellow>"
    active-disk-network: "<yellow>Network ID: {network_id}</yellow>"
    active-disk-location: "<yellow>Drive Bay Location: {world} ({x}, {y}, {z}) - Slot {slot}</yellow>"
    active-disk-confirm: "{mss-prefix}<red>Recovering this disk will remove it from the active network and could cause data loss!</red>"
    active-disk-usage: "{mss-prefix}<red>Use '/mss recovery {disk_id} confirm' to proceed anyway.</red>"

  give:
    console-needs-player: "{mss-prefix}<red>You must specify a player when using this command from console.</red>"
    invalid-item: "{mss-prefix}<red>Invalid item type. Available:</red>"
    available-blocks: "{mss-prefix}<yellow>Blocks: server, bay, terminal, cable, exporter, importer</yellow>"
    available-disks: "{mss-prefix}<yellow>Disks: disk1k, disk4k, disk16k, disk64k</yellow>"
    available-components: "{mss-prefix}<yellow>Components: housing, platter1k, platter4k, platter16k, platter64k</yellow>"
    success-dropped: "{mss-prefix}<green>Item given to {player} (dropped due to full inventory).</green>"
    success-inventory: "{mss-prefix}<green>Item given to {player}.</green>"
    received: "{mss-prefix}<green>You received a {item} from {sender}.</green>"

  info:
    networks: "{mss-prefix}<yellow>Active Networks: {count}</yellow>"
    disks: "{mss-prefix}<yellow>Total Storage Disks: {count}</yellow>"
    item-types: "{mss-prefix}<yellow>Item Types Stored: {types}</yellow>"
    total-items: "{mss-prefix}<yellow>Total Items Stored: {total}</yellow>"
    cables: "{mss-prefix}<yellow>PoE Cables Placed: {count}</yellow>"
    exporters: "{mss-prefix}<yellow>Exporters Placed: {count}</yellow>"
    importers: "{mss-prefix}<yellow>Importers Placed: {count}</yellow>"
    recipes-enabled: "{mss-prefix}<green>Recipes: Enabled ({registered}/{total} registered)</green>"
    recipes-disabled: "<{mss-prefix}red>Recipes: Disabled ({registered}/{total} registered)</red>"
    error: "{mss-prefix}<red>Error retrieving information: {error}</red>"

  cleanup:
    orphaned-items: "{mss-prefix}<green>Cleaned up {count} orphaned storage items.</green>"
    reset-disks: "{mss-prefix}<green>Reset {count} empty storage disk cell counts.</green>"
    success: "{mss-prefix}<green>Cleanup completed successfully!</green>"
    error: "{mss-prefix}<red>Error during cleanup: {error}</red>"

  reload:
    usage: "{mss-prefix}<red>Usage: /mss reload [config|recipes|lang|all]</red>"
    config-success: "{mss-prefix}<green>Main configuration reloaded successfully!</green>"
    config-error: "{mss-prefix}<red>Error reloading config: {error}</red>"
    recipes-success: "{mss-prefix}<green>Recipes configuration reloaded successfully!</green>"
    recipes-note: "{mss-prefix}<yellow>Note: Server restart may be required for recipe changes to take full effect.</yellow>"
    recipes-error: "{mss-prefix}<red>Error reloading recipes: {error}</red>"
    lang-success: "{mss-prefix}<green>Language files reloaded successfully!</green>"
    lang-error: "{mss-prefix}<red>Error reloading language files: {error}</red>"
    all-success: "{mss-prefix}<green>All configurations reloaded successfully!</green>"
    all-error: "{mss-prefix}<red>Error reloading configurations: {error}</red>"

  migratedb:
    invalid-source: "{mss-prefix}<red>Source must be 'sqlite' or 'mysql'.</red>"
    same-as-active: "{mss-prefix}<red>Source '{source}' is the same as the active database. Set database.type to the destination and restart first, then import FROM the other type.</red>"
    confirm-warn: "{mss-prefix}<yellow>This REPLACES all data in the active <white>{active}</white> database with data imported from <white>{source}</white>.</yellow>"
    confirm-howto: "{mss-prefix}<yellow>Back up first, then run <white>/mss migratedb {source} confirm</white> to proceed (ideally with no players online).</yellow>"
    importing: "{mss-prefix}<gray>Importing data from <white>{source}</white> into the active <white>{active}</white> database...</gray>"
    complete: "{mss-prefix}<green>Migration complete: <white>{rows}</white> rows imported from <white>{source}</white>.</green>"
    table-row: "{mss-prefix}<gray>  {table}: <white>{count}</white></gray>"
    restart-note: "{mss-prefix}<yellow>Restart the server now so all in-memory caches reflect the imported data.</yellow>"
    failed: "{mss-prefix}<red>Migration failed: {error}</red> <gray>(active database left unchanged)</gray>"

  convert:
    confirm-warn: "{mss-prefix}<yellow>This re-types every already-placed MSS block in loaded chunks to its <white>{mode}</white> material so existing builds match the current resource-pack mode. Identity is preserved — networks keep working.</yellow>"
    confirm-howto: "{mss-prefix}<gray>Unloaded chunks are skipped (they auto-convert when you break + re-place, or re-run nearby). Run <white>/mss convert confirm</white> to proceed.</gray>"
    complete: "{mss-prefix}<green>Convert → <white>{mode}</white>: <white>{converted}</white> converted, <white>{unloaded}</white> in unloaded chunks, <white>{mismatch}</white> not an MSS block (skipped).</green>"
    failed: "{mss-prefix}<red>Convert failed: {error}</red>"

errors:

  network:
    invalid: "{mss-prefix}<red>This network is no longer valid</red>"
    not-connected-assigned: "{mss-prefix}<red>This {device} is not connected to its assigned network</red>"
    not-connected-any: "{mss-prefix}<red>This {device} is not connected to any network</red>"
    connection-lost: "{mss-prefix}<red>Network connection lost - please check your storage system</red>"
    dissolved-drive-bay: "{mss-prefix}<yellow>Storage network dissolved - you can still manage disks in this drive bay</yellow>"
    exporter-not-connected: "{mss-prefix}<red>This exporter is not connected to a valid network.</red>"
    importer-not-connected: "{mss-prefix}<red>This importer is not connected to a valid network.</red>"
    terminal-not-connected: "{mss-prefix}<red>This terminal is not connected to a valid network.</red>"
    exporter-data-not-found: "{mss-prefix}<red>Exporter data not found. Try breaking and replacing the block.</red>"
    importer-data-not-found: "{mss-prefix}<red>Importer data not found. Try breaking and replacing the block.</red>"
    security-terminal-data-not-found: "{mss-prefix}<red>Security terminal data not found. Try breaking and replacing the block.</red>"

  gui:
    network-invalid: "{mss-prefix}<yellow>Storage network is no longer valid.</yellow>"
    error-opening: "{mss-prefix}<red>Error opening {gui} GUI: {error}</red>"

    anvil:
      mss-items-blocked: "{mss-prefix}<red>You cannot use MSS items in anvils!</red>"

  search:
    timeout: "{mss-prefix}<red>Search timed out.</red>"
    cancelled: "{mss-prefix}<red>Search cancelled.</red>"
    cleared: "{mss-prefix}<yellow>Search cleared.</yellow>"
    saved: "{mss-prefix}<green>Search saved: '{term}'.</green>"

  placement:
    multiple-storage-servers: "{mss-prefix}<red>Cannot connect networks: Multiple networks have Storage Servers!</red>"
    multiple-security-terminals: "{mss-prefix}<red>Cannot connect networks: Multiple networks have Security Terminals!</red>"
    storage-server-conflict: "{mss-prefix}<red>Cannot place Server: Adjacent network already has a Server!</red>"
    security-terminal-conflict: "{mss-prefix}<red>Cannot place Security Terminal: Adjacent network already has a Security Terminal!</red>"
    cable-limit-exceeded: "{mss-prefix}<red>PoE cable limit exceeded! Maximum <yellow>{max}</yellow> cables per network.</red>"
    storage-disks-blocks: "{mss-prefix}<red>Storage disks cannot be placed as blocks!</red>"
    mss-components-blocks: "{mss-prefix}<red>Modular Storage components cannot be placed as blocks!</red>"
    exporter-cannot-attach: "{mss-prefix}<red>You cannot attach an exporter directly to the network!</red>"
    importer-cannot-attach: "{mss-prefix}<red>You cannot attach an importer directly to the network!</red>"
    network-size-limit: "{mss-prefix}<red>Network size limit exceeded! Maximum <yellow>{max}</yellow> blocks per network.</red>"
    exporter-limit-reached: "{mss-prefix}<red>Exporter limit reached! Maximum <yellow>{max}</yellow> exporters per network.</red>"
    importer-limit-reached: "{mss-prefix}<red>Importer limit reached! Maximum <yellow>{max}</yellow> importers per network.</red>"
    block-error: "{mss-prefix}<red>Error placing block: <gray>{error}</gray></red>"
    cable-repels-water: "{mss-prefix}<aqua>PoE cables repel water — they can't be waterlogged.</aqua>"
    access-denied-place-blocks: "{mss-prefix}<red>🔒 Access Denied: You are not authorized to place network blocks.</red>"
    access-denied-remove-blocks: "{mss-prefix}<red>🔒 Access Denied: You are not authorized to remove network blocks.</red>"
    access-denied-manage-network: "{mss-prefix}<red>🔒 Access Denied: You are not authorized to manage this network.</red>"

  interaction:
    no-use-permission-exporters: "{mss-prefix}<red>You don't have permission to use Exporters.</red>"
    no-use-permission-importers: "{mss-prefix}<red>You don't have permission to use importers.</red>"
    no-use-permission-terminals: "{mss-prefix}<red>You don't have permission to use terminals.</red>"
