    no-use-permission-drive-bays: "{mss-prefix}<red>You don't have permission to use drive bays.</red>"
    access-denied-access-items: "{mss-prefix}<red>Access Denied: You are not authorized to access network items.</red>"

  recipes:
    recipe-header: "{mss-prefix}<gold>=== Recipe: {recipe} ===</gold>"
    recipes-header: "{mss-prefix}<gold>=== Modular Storage System Recipes ===</gold>"
    recipe-status: "{mss-prefix}Status: {status}"
    recipes-system-status: "{mss-prefix}Recipes system: {status}"
    recipe-type: "{mss-prefix}Type: {type}"
    recipe-description: "{mss-prefix}<gray>Description: {description}</gray>"
    recipe-result: "{mss-prefix}<yellow>Result: {amount}x {item}</yellow>"
