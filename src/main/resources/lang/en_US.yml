  disk_platter_64k: "64k Disk Platter"
  storage_disk_housing: "Storage Disk Housing"

# In-world display for MSS items: the hover name and the lore (tooltip lines).
# Each entry has a `name` and a `lore` list. Blank lore lines are written as "".
# (Note: the `items:` section above is the plain friendly-name lookup used in
#  permission/give messages; `item:` here is the actual item name + tooltip.)
item:
  storage_server:
    name: "<aqua>Server"
    lore:
      - "<blue>Modular Storage System"
      - ""
  drive_bay:
    name: "<aqua>Drive Bay"
    lore:
      - "<blue>Modular Storage System"
      - ""
  mss_terminal:
    name: "<aqua>Terminal"
    lore:
      - "<blue>Modular Storage System"
      - ""
  network_cable:
    name: "<aqua>PoE Cable"
    lore:
      - "<blue>Modular Storage System"
      - ""
      - "<grey>Carries power and data to link MSS devices and I/O"
  exporter:
    name: "<aqua>Exporter"
    lore:
      - "<blue>Modular Storage System"
      - ""
      - "<grey>Exports items from MSS Network"
  importer:
    name: "<aqua>Importer"
    lore:
      - "<blue>Modular Storage System"
      - ""
      - "<grey>Imports items to MSS Network"
  security_terminal:
    name: "<aqua>Security Terminal"
    lore:
      - "<blue>Modular Storage System"
      - ""
  disk_housing:
    name: "<aqua>Disk Housing"
    lore:
      - "<blue>Modular Storage System"
      - ""
      - "<yellow>Crafting Component"
  mss_wrench:
    name: "<!italic><white>Iron Wrench"
    lore:
      - "<blue>Modular Storage System"
      - ""
      - "<yellow>Right-click</yellow><gray> a block to rotate it"
      - "<yellow>Shift + Right-click</yellow><gray> to dismantle to inventory"
  # {tier} is replaced with 1k/4k/16k/64k at runtime
  disk_platter:
    name: "<aqua>{tier} Platter"
    lore:
      - "<blue>Modular Storage System"
      - ""
      - "<yellow>Crafting Component"
  # Storage-disk names are per-tier (different colour each). The tooltip/lore is
  # built from the gui.storage-disk.* keys below (capacity, cells, crafter, id).
  storage_disk:
    name_1k: "<red>1k Storage Disk"
    name_4k: "<gold>4k Storage Disk"
    name_16k: "<green>16k Storage Disk"
    name_64k: "<light_purple>64k Storage Disk"

